name: Reusable Verify And Build

on:
  workflow_call:
    inputs:
      upload-pages-artifact:
        type: boolean
        required: false
        default: false
      run-audit:
        type: boolean
        required: false
        default: true
      require-main-ref:
        type: boolean
        required: false
        default: false
      base-path:
        type: string
        required: false
        default: /

permissions:
  contents: read

jobs:
  verify-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Enforce main branch for publish flows
        if: ${{ inputs.require-main-ref }}
        run: |
          test "${GITHUB_REF}" = "refs/heads/main" || {
            echo "::error::Pages deployment is only allowed from the main branch."
            exit 1
          }

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Pages
        if: ${{ inputs.upload-pages-artifact }}
        id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install
        run: npm ci

      - name: Audit
        if: ${{ inputs.run-audit }}
        run: npm audit --audit-level=high

      - name: Core tests
        run: npm run test:core

      - name: CLI tests
        run: npm run test:cli

      - name: Core/CLI parity tests
        run: npm run test:parity

      - name: Self-test
        run: npm run selftest

      - name: CLI self-test
        run: npm run cli:selftest

      - name: Schema fixtures
        run: npm run schema:fixtures

      - name: Binary corpus
        run: npm run corpus:verify

      - name: Build
        env:
          BASE_PATH: ${{ inputs.base-path }}
        run: npm run build

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Browser tests
        run: npm run test:browser

      - name: Upload artifact
        if: ${{ inputs.upload-pages-artifact }}
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist
